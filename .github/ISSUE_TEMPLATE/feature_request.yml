name: Feature Request
description: Suggest an API addition or improvement for storedoc-rust
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case (especially for Tauri/Rust apps).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / Solution
      description: How would you like the Rust API or types to look?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked existing issues and PRs for duplicates.
          required: true
